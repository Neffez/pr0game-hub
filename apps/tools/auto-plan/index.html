<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Auto Plan · pr0game</title>
<meta name="description" content="Auto plan for pr0game: the build order that reaches your target levels of buildings, research, ships and defense fastest, with mines, energy and storages, searched in your browser. Autoplan für pr0game: die Bauliste, die deine Zielstufen am schnellsten erreicht.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="pr0game tools">
<meta property="og:title" content="Auto Plan · pr0game">
<meta property="og:description" content="Auto plan for pr0game: the build order that reaches your target levels of buildings, research, ships and defense fastest, with mines, energy and storages, searched in your browser. Autoplan für pr0game: die Bauliste, die deine Zielstufen am schnellsten erreicht.">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="de_DE">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230d1117'/%3E%3Cpath d='M18 5L9 18h6l-2 9 9-13h-6z' fill='%23f2683c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tools.css">
<style>
/* Auto plan: layout, level grids, target rows, progress and the plan's table (base look in ../shared/tools.css) */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 1000px) {
  .layout { grid-template-columns: minmax(360px, 440px) minmax(0, 1fr); align-items: start; }
}
.card-title .title-spacer { flex: 1; }
.add-btn { display: inline-flex; align-items: center; gap: 5px; text-transform: none; letter-spacing: 0; }
.levels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.lvl {
  display: grid; grid-template-columns: minmax(0, 1fr) 64px; align-items: center; gap: 6px;
  padding: 4px 4px 4px 10px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid transparent;
}
.lvl.has { border-color: var(--border-strong); }
.lvl label { font-size: 12.5px; font-weight: 500; line-height: 1.25; overflow-wrap: break-word; hyphens: auto; }
.lvl input, .target input {
  width: 100%; text-align: right; font-family: var(--mono); background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; outline: none;
}
.lvl input:focus, .target input:focus, .target select:focus { border-color: var(--accent); }
.lvl input.invalid, .target input.invalid, .field input.invalid { border-color: var(--danger); }
details.sub { margin-top: 14px; }
details.sub > summary { cursor: pointer; font-size: 12.5px; color: var(--muted); font-weight: 500; }
details.sub[open] > summary { margin-bottom: 10px; }
.level-meta { font-weight: 400; color: var(--faint); margin-left: 4px; }
.targets { display: flex; flex-direction: column; gap: 6px; }
.target {
  display: grid; grid-template-columns: 104px minmax(0, 1fr) 84px 30px; align-items: center; gap: 6px;
  padding: 5px; border-radius: var(--radius-sm); background: var(--surface-2);
}
.target select {
  width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 6px; outline: none; font-size: 13px;
}
.target .now { grid-column: 2 / -1; font-size: 11.5px; color: var(--faint); font-family: var(--mono); padding-left: 2px; }
.target .icon-btn { width: 30px; height: 30px; }
.target .icon-btn:hover { color: var(--danger); }
.targets .empty { padding: 14px 8px; font-size: 13px; }
.paste textarea { min-height: 160px; width: 100%; font-family: var(--mono); font-size: 12px; }
.paste .hint { margin-top: 6px; }
.switches { display: flex; flex-wrap: wrap; gap: 10px 18px; }
.opt-row { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 14px; }
.opt-row .field { width: 120px; }
.forbid { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12.5px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); cursor: pointer; user-select: none;
}
.chip input { accent-color: var(--accent); }
.chip.on { border-color: var(--danger); color: var(--text); }
.run-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: relative; padding-bottom: 6px; }
.run-row .btn { display: inline-flex; align-items: center; gap: 6px; }
.run-status { font-size: 12.5px; color: var(--muted); }
.progress { position: absolute; left: 0; right: 0; bottom: -6px; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.progress-bar { height: 100%; width: 0; background: var(--accent); transition: width .4s linear; }
#results .hero { margin-top: 18px; }
#results .kpi-value { white-space: normal; }
#results.stale .hero, #results.stale .plan { opacity: .55; }
.plan { margin-top: 16px; }
.plan-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.plan-head .sub-title { flex: 1; }
.sub-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.plan-table { max-height: 70vh; overflow: auto; }
.plan-table th { position: sticky; top: 0; z-index: 1; }
.plan-table td.idx { color: var(--faint); width: 1%; }
.plan-table table { table-layout: fixed; min-width: 560px; }
.plan-table th:first-child { width: 48px; }
.plan-table th.col-start, .plan-table th.col-end { width: 150px; }
.plan-table th.col-dur { width: 84px; }
.plan-table td.name, .plan-table th.col-step { text-align: left; white-space: normal; overflow-wrap: break-word; }
.plan-table td .kind { display: block; font-size: 11px; color: var(--faint); font-weight: 400; }
.plan-table tr.prod td.name { color: var(--muted); font-weight: 400; }
.plan-table tr.goal td.name { color: var(--accent-text); }
@media (max-width: 640px) {
  .levels { grid-template-columns: minmax(0, 1fr); }
  .target { grid-template-columns: minmax(0, 1fr) 84px 30px; }
  .target select.kind { grid-column: 1 / -1; }
  .target .now { grid-column: 1 / -1; }
  .kpi.big { grid-column: 1 / -1; }
  .plan-table th, .plan-table td { padding: 7px 6px; }
  .plan-table .col-start, .plan-table .col-dur { display: none; }
  .plan-table table { min-width: 0; }
  .plan-table th:first-child { width: 36px; }
  .plan-table th.col-end { width: 142px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/" data-t-title="allTools">
      <div class="brand-logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <div><strong data-t="title">Auto Plan</strong></div>
    </a>
    <div class="top-actions">
      <button class="uni-chip" id="uniChip" type="button" data-t-title="uniSettings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
        <span id="uniSummary"></span>
      </button>
      <div class="seg small" id="langSeg" role="group" data-t-aria="language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="de">DE</button>
      </div>
      <button type="button" class="btn share-btn" id="shareBtn" data-t-title="shareTitle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span class="lbl" data-t="share">Share link</span>
      </button>
      <button type="button" class="btn ghost" id="resetBtn" data-t="reset">New</button>
      <button class="icon-btn" id="settingsBtn" type="button" data-t-title="uniSettings" data-t-aria="uniSettings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <p class="intro" data-t="intro"></p>

  <main class="layout">
    <div class="col">
      <section class="card">
        <h2 class="card-title"><span data-t="planetCard">Planet</span>
          <button type="button" class="tip" data-t-aria="info" aria-label="Info" data-t-tip="planetTip"></button>
          <span class="title-spacer"></span>
          <button type="button" class="btn small add-btn" id="pasteBtn" data-t-title="pasteTitle">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
            <span data-t="pasteBtn">From game page</span>
          </button>
        </h2>
        <div class="stack">
          <div class="grid2">
            <div class="field">
              <div class="label-row"><label for="tempIn" data-t="temp">Max. temperature (°C)</label><button type="button" class="tip" data-t-aria="info" aria-label="Info" data-t-tip="tempTip"></button></div>
              <input id="tempIn" type="text" inputmode="numeric" autocomplete="off">
            </div>
            <div class="field">
              <div class="label-row"><label for="startIn" data-t="start">Start</label><button type="button" class="tip" data-t-aria="info" aria-label="Info" data-t-tip="startTip"></button></div>
              <input id="startIn" type="datetime-local">
            </div>
          </div>
          <div class="grid3" id="resFields"></div>
        </div>
        <details class="sub" id="buildingsBox">
          <summary><span data-t="buildings">Building levels</span><span class="level-meta" id="buildingsMeta"></span></summary>
          <div class="levels" id="buildings"></div>
        </details>
        <details class="sub" id="researchBox">
          <summary><span data-t="research">Research</span><span class="level-meta" id="researchMeta"></span></summary>
          <div class="levels" id="research"></div>
        </details>
      </section>

      <section class="card">
        <h2 class="card-title"><span data-t="targetsCard">Targets</span>
          <button type="button" class="tip" data-t-aria="info" aria-label="Info" data-t-tip="targetsTip"></button>
          <span class="title-spacer"></span>
          <button type="button" class="btn small add-btn" id="addTarget">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span data-t="addTarget">Target</span>
          </button>
        </h2>
        <div class="targets" id="targets"></div>
      </section>

      <details class="card" id="searchBox">
        <summary class="card-title"><span data-t="searchCard">Search</span><span class="card-meta" id="searchMeta"></span></summary>
        <div class="stack">
          <div class="opt-row">
            <div class="field">
              <label for="budgetIn" data-t="budget">Search time</label>
              <select id="budgetIn"></select>
            </div>
            <div class="field">
              <div class="label-row"><label for="workersIn" data-t="workers">Workers</label><button type="button" class="tip" data-t-aria="info" aria-label="Info" data-t-tip="workersTip"></button></div>
              <input id="workersIn" type="number" min="1" step="1" inputmode="numeric">
            </div>
          </div>
          <div class="switches">
            <label class="switch"><input type="checkbox" id="economyIn"><span class="track"></span><span data-t="economy">Insert mines and energy</span></label>
            <button type="button" class="tip" data-t-aria="info" aria-label="Info" data-t-tip="economyTip"></button>
            <label class="switch"><input type="checkbox" id="throttleIn"><span class="track"></span><span data-t="throttle">Production settings</span></label>
            <button type="button" class="tip" data-t-aria="info" aria-label="Info" data-t-tip="throttleTip"></button>
          </div>
          <div class="field">
            <div class="label-row"><span class="field-label" data-t="forbid">Never insert</span><button type="button" class="tip" data-t-aria="info" aria-label="Info" data-t-tip="forbidTip"></button></div>
            <div class="forbid" id="forbid"></div>
          </div>
          <div class="opt-row">
            <label class="switch"><input type="checkbox" id="ratioIn"><span class="track"></span><span data-t="mineRatio">Keep the mines together</span></label>
            <button type="button" class="tip" data-t-aria="info" aria-label="Info" data-t-tip="mineRatioTip"></button>
          </div>
          <div class="opt-row" id="ratioFields">
            <div class="field"><label for="ratioK" data-t="crystalBelowMetal">Crystal below metal</label><input id="ratioK" type="number" min="0" max="50" step="1" inputmode="numeric"></div>
            <div class="field"><label for="ratioD" data-t="deutBelowCrystal">Deut. below crystal</label><input id="ratioD" type="number" min="0" max="50" step="1" inputmode="numeric"></div>
          </div>
          <div class="opt-row">
            <label class="switch"><input type="checkbox" id="quietIn"><span class="track"></span><span data-t="quietHours">Quiet hours</span></label>
            <button type="button" class="tip" data-t-aria="info" aria-label="Info" data-t-tip="quietHoursTip"></button>
          </div>
          <div class="opt-row" id="quietFields">
            <div class="field"><label for="quietFrom" data-t="from">From (hour)</label><input id="quietFrom" type="number" min="0" max="24" step="0.5" inputmode="decimal"></div>
            <div class="field"><label for="quietTo" data-t="to">To (hour)</label><input id="quietTo" type="number" min="0" max="24" step="0.5" inputmode="decimal"></div>
          </div>
        </div>
      </details>
    </div>

    <div class="col">
      <section class="card" id="results" aria-live="off">
        <h2 class="card-title"><span data-t="result">Plan</span>
          <button type="button" class="tip" data-t-aria="info" aria-label="Info" data-t-tip="resultTip"></button>
        </h2>
        <div class="run-row">
          <button type="button" class="btn primary" id="runBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            <span data-t="run">Plan</span>
          </button>
          <button type="button" class="btn" id="stopBtn" data-t="stop" hidden>Stop</button>
          <span class="run-status" id="runStatus"></span>
          <div class="progress" id="progress" hidden><div class="progress-bar" id="progressBar"></div></div>
        </div>
        <div class="notes" id="notes" style="margin-top: 14px"></div>
        <div class="hero" id="hero" hidden></div>
        <div class="plan" id="plan" hidden>
          <div class="plan-head">
            <span class="sub-title" id="planTitle"></span>
            <button type="button" class="btn small" id="copyBtn" data-t="copyPlan">Copy as text</button>
          </div>
          <div class="table-wrap plan-table"><table id="planTable"><thead></thead><tbody></tbody></table></div>
        </div>
      </section>
    </div>
  </main>

  <p class="foot"><span data-t="foot"></span> · <a href="https://github.com/Neffez/pr0game-hub" target="_blank" rel="noopener" data-t="source">Source code</a></p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="pasteDialog" aria-labelledby="pasteTitle">
  <form method="dialog" class="dlg">
    <div class="dlg-head">
      <div><h2 id="pasteTitle" data-t="pasteTitle">Paste a game page</h2><p data-t="pasteSub"></p></div>
      <button class="icon-btn" value="close" data-t-aria="close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="dlg-body paste">
      <textarea id="pasteIn" spellcheck="false" data-t-ph="pastePh" aria-labelledby="pasteTitle"></textarea>
      <p class="hint" id="pasteHint" hidden></p>
    </div>
    <div class="dlg-foot"><span></span><button class="btn primary" value="close" data-t="done">Done</button></div>
  </form>
</dialog>

<dialog id="settings" aria-labelledby="settingsTitle">
  <form method="dialog" class="dlg">
    <div class="dlg-head">
      <div><h2 id="settingsTitle" data-t="uniSettings">Universe settings</h2><p data-t="storedLocally">Stored locally in your browser.</p></div>
      <button class="icon-btn" value="close" data-t-aria="close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="dlg-body" id="uniFields"></div>
    <div class="dlg-foot">
      <button type="button" class="btn ghost" id="uniReset" data-t="defaults">Defaults</button>
      <button class="btn primary" value="close" data-t="done">Done</button>
    </div>
  </form>
</dialog>
<script type="module" src="./main.js"></script>
</body>
</html>
