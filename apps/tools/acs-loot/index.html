<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ACS Loot Calculator · pr0game</title>
<meta name="description" content="Share the loot and debris of an ACS in pr0game: covers losses and deuterium, splits the profit equally or by investment, plans the deliveries.">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230d1117'/%3E%3Cpath d='M9 22l4-1 9-9a3 3 0 00-4-4l-9 9-1 4z' fill='%23f2683c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117;
  --bg-glow: rgba(242, 104, 60, 0.08);
  --surface: #151b23;
  --surface-2: #1c2430;
  --border: #283241;
  --border-strong: #3a4657;
  --text: #e6edf3;
  --muted: #8b98a9;
  --faint: #5d6a7b;
  --accent: #f2683c;
  --accent-soft: rgba(242, 104, 60, 0.14);
  --accent-text: #ff8a5c;
  --danger: #f2555a;
  --ok: #4cc38a;
  --warn: #e5b33a;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f5f7;
    --bg-glow: rgba(242, 104, 60, 0.07);
    --surface: #ffffff;
    --surface-2: #f1f3f6;
    --border: #e1e5eb;
    --border-strong: #c9d0da;
    --text: #18202b;
    --muted: #5f6b7b;
    --faint: #98a2b0;
    --accent: #e4572a;
    --accent-soft: rgba(228, 87, 42, 0.1);
    --accent-text: #c9471c;
    --ok: #1f9d63;
    --warn: #b9860c;
    --shadow: 0 10px 30px rgba(20, 30, 50, 0.08);
    color-scheme: light;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  color: var(--text);
  background:
    radial-gradient(1100px 500px at 85% -10%, var(--bg-glow), transparent 70%),
    var(--bg);
  min-height: 100vh;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, td, .kpi-value, input.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.wrap { max-width: 1320px; margin: 0 auto; padding: 0 20px 96px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
.brand-logo { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.brand strong { display: block; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.brand span { display: block; font-size: 12px; color: var(--muted); }
.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.intro { color: var(--muted); max-width: 90ch; margin-bottom: 18px; }

/* Layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 1100px) {
  .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .col-results { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; }
}
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.card-title {
  display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px;
}
.card-title .spacer { flex: 1; }
.card-hint { font-size: 12.5px; color: var(--faint); margin-bottom: 12px; }
.sub { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 14px; }
.sub:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.sub-title { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 10px; }
.sub-title .meta { font-weight: 400; color: var(--faint); font-size: 12.5px; }
.sub-title .spacer { flex: 1; }

/* Fields */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field-label { font-size: 12px; color: var(--muted); font-weight: 500; }
.input, .field input, .field select, textarea, td input, td select {
  width: 100%; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 8px 10px; outline: none; transition: border-color .15s, background .15s;
}
td input, td select { padding: 6px 8px; border-radius: 6px; min-width: 70px; }
td select { min-width: 120px; }
.grid3 td input, td .grid3 input { padding: 6px 5px; min-width: 64px; }
input.num { text-align: right; }
input:hover, select:hover, textarea:hover { border-color: var(--border-strong); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); background: var(--surface); }
input.invalid { border-color: var(--danger); }
textarea { min-height: 84px; resize: vertical; font-family: var(--mono); font-size: 12px; }
.hint { font-size: 12px; color: var(--faint); }
.hint.err { color: var(--danger); }
.hint.ok { color: var(--ok); }
.debris-summary { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; margin-bottom: 8px; }
.debris-summary:empty { display: none; }
.debris-summary .meta { color: var(--faint); }
.debris-summary .err { color: var(--danger); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); }
.seg button {
  flex: 1 1 auto; border: 0; background: transparent; padding: 7px 10px; border-radius: 6px;
  color: var(--muted); font-weight: 500; font-size: 13px; white-space: nowrap; transition: background .15s, color .15s;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.seg.small button { padding: 5px 9px; font-size: 12.5px; }

.btn {
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  padding: 7px 12px; border-radius: var(--radius-sm); font-weight: 500; font-size: 13px; white-space: nowrap;
  transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--border-strong); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 9px; font-size: 12.5px; }
.x {
  width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 6px;
  border: 1px solid transparent; background: transparent; color: var(--faint);
}
.x:hover { color: var(--danger); border-color: var(--border); }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: right; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 10px; background: var(--surface-2); white-space: nowrap; font-family: var(--sans); }
td { text-align: right; padding: 6px 10px; border-top: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
th:first-child, td:first-child { text-align: left; }
td.name { font-family: var(--sans); font-weight: 500; }
td .tag { font-family: var(--sans); font-size: 11px; color: var(--faint); margin-left: 6px; font-weight: 400; }
th.group { text-align: center; border-left: 1px solid var(--border); }
td.gl, th.gl { border-left: 1px solid var(--border); }
.pos { color: var(--ok); }
.neg { color: var(--danger); }
.dim { color: var(--faint); }

/* Results */
.hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi-label { font-size: 12px; color: var(--muted); }
.kpi-value { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-sub { font-size: 11.5px; color: var(--faint); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.big { background: var(--accent-soft); }
.kpi.big .kpi-value { color: var(--accent-text); }
.notes { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.note { font-size: 12.5px; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--surface-2); color: var(--muted); }
.note.warn { color: var(--warn); background: rgba(229,179,58,.1); }
.note.err { color: var(--danger); background: rgba(242,85,90,.1); }
pre.text {
  white-space: pre-wrap; font-family: var(--mono); font-size: 12px; padding: 10px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border); margin-top: 10px;
}

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 9px 14px; border-radius: var(--radius-sm); font-size: 13px; box-shadow: var(--shadow); z-index: 50;
}
footer { margin-top: 32px; color: var(--faint); font-size: 12.5px; text-align: center; }
@media (max-width: 640px) {
  .wrap { padding: 0 12px 64px; }
  .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  /* table rows as small cards: the person on top, the amounts below */
  .stack-table thead { display: none; }
  .stack-table tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--border); }
  .stack-table tr:first-child { border-top: 0; }
  .stack-table td { display: block; padding: 0; border: 0; }
  .stack-table td:first-child { grid-column: 1 / -1; }
  .stack-table td input, .stack-table td select { width: 100%; min-width: 0; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/">
      <div class="brand-logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
      </div>
      <div><strong data-t="title">ACS Loot Calculator</strong><span data-t="subtitle"></span></div>
    </a>
    <div class="top-actions">
      <div class="seg small" id="langSeg" role="group">
        <button type="button" data-lang="de">DE</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" class="btn" id="shareBtn" data-t="share">Share link</button>
      <button type="button" class="btn ghost" id="resetBtn" data-t="reset">New</button>
    </div>
  </header>
  <p class="intro" data-t="intro"></p>

  <div class="layout">
    <div class="col">
      <section class="card" id="settings"></section>
      <section class="card" id="participants"></section>
      <section class="card" id="battles"></section>
      <section class="card" id="recycling"></section>
      <section class="card" id="helpers"></section>
    </div>
    <div class="col col-results">
      <section class="card" id="results"></section>
      <section class="card" id="transfers"></section>
    </div>
  </div>
  <footer data-t="footer"></footer>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="./main.js"></script>
</body>
</html>
