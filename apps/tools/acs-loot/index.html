<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ACS Loot Calculator · pr0game</title>
<meta name="description" content="Share the loot and debris of an ACS in pr0game: covers losses and deuterium, splits the profit equally or by investment, plans the deliveries. AKS-Beuterechner für pr0game: Beute und Trümmerfeld fair aufteilen.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="pr0game tools">
<meta property="og:title" content="ACS Loot Calculator · pr0game">
<meta property="og:description" content="Share the loot and debris of an ACS in pr0game: covers losses and deuterium, splits the profit equally or by investment, plans the deliveries. AKS-Beuterechner für pr0game: Beute und Trümmerfeld fair aufteilen.">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="de_DE">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230d1117'/%3E%3Cpath d='M9 22l4-1 9-9a3 3 0 00-4-4l-9 9-1 4z' fill='%23f2683c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tools.css">
<style>
/* ACS loot calculator: layout, participant tables and transfer text (base look in ../shared/tools.css) */
body .wrap { max-width: 1320px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 1100px) {
  .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .col-results { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; }
}
.card-title { margin-bottom: 6px; }
.sub { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 14px; }
.sub:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.sub-title { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 10px; }
.sub-title .meta { font-weight: 400; color: var(--faint); font-size: 12.5px; }
.sub-title .spacer { flex: 1; }
.field input, .field select, textarea { padding: 8px 10px; }
td input, td select {
  width: 100%; background: var(--surface-2); border: 1px solid var(--border); outline: none;
  padding: 6px 8px; border-radius: 6px; min-width: 70px; transition: border-color .15s, background .15s;
}
td select { min-width: 120px; }
td input:hover, td select:hover { border-color: var(--border-strong); }
td input:focus, td select:focus { border-color: var(--accent); background: var(--surface); }
.grid3 td input, td .grid3 input { padding: 6px 5px; min-width: 64px; }
.debris-summary { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; margin-bottom: 8px; }
.debris-summary:empty { display: none; }
.debris-summary .meta { color: var(--faint); }
.debris-summary .err { color: var(--danger); }
.x {
  width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 6px;
  border: 1px solid transparent; background: transparent; color: var(--faint);
}
.x:hover { color: var(--danger); border-color: var(--border); }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
/* central paste field */
#paste textarea { min-height: 84px; }
#paste .owner { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
#paste .owner select { width: auto; }
#paste .owner-name { width: 150px; }
/* computed values: the input and where it comes from */
.auto-cell { display: flex; align-items: center; gap: 4px; }
.auto-mark { flex: none; font-size: 10.5px; color: var(--faint); white-space: nowrap; }
.auto-mark:empty { display: none; }
.auto-mark .auto-on { color: var(--accent-text); }
.auto-mark .auto-miss { color: var(--warn, #d29922); }
.auto-reset { border: 0; background: transparent; color: var(--faint); padding: 0 2px; font-size: 13px; }
.auto-reset:hover { color: var(--accent); }
td input.drives { min-width: 92px; }
.auto-cell input { min-width: 100px; }
th { padding: 8px 10px; }
td { padding: 6px 10px; vertical-align: middle; }
td .tag { font-family: var(--sans); font-size: 11px; color: var(--faint); margin-left: 6px; font-weight: 400; }
th.group { text-align: center; border-left: 1px solid var(--border); }
td.gl, th.gl { border-left: 1px solid var(--border); }
.hero { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-bottom: 14px; }
.kpi { padding: 10px 12px; }
.kpi-value { font-size: 16px; }
.kpi-sub { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
pre.text {
  white-space: pre-wrap; font-family: var(--mono); font-size: 12px; padding: 10px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--border); margin-top: 10px;
}
@media (max-width: 640px) {
  /* table rows as small cards: the person on top, the amounts below */
  .stack-table thead { display: none; }
  .stack-table tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--border); }
  .stack-table tr:first-child { border-top: 0; }
  .stack-table td { display: block; padding: 0; border: 0; }
  .stack-table td:first-child { grid-column: 1 / -1; }
  .stack-table td input, .stack-table td select { width: 100%; min-width: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/" data-t-title="allTools">
      <div class="brand-logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
      </div>
      <div><strong data-t="title">ACS Loot Calculator</strong></div>
    </a>
    <div class="top-actions">
      <div class="seg small" id="langSeg" role="group" data-t-aria="language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="de">DE</button>
      </div>
      <button class="uni-chip" id="uniChip" type="button" data-t-title="uniSettings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
        <span id="uniSummary"></span>
      </button>
      <button type="button" class="btn share-btn" id="shareBtn" data-t-title="shareTitle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span class="lbl" data-t="share">Share link</span>
      </button>
      <button type="button" class="btn ghost" id="resetBtn" data-t="reset">New</button>
      <button class="icon-btn" id="settingsBtn" type="button" data-t-title="uniSettings" data-t-aria="uniSettings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>
  <p class="intro" data-t="intro"></p>
  <div class="calc-tabs" id="calcTabs" role="tablist" data-t-aria="tabsAria"></div>

  <div class="layout">
    <div class="col">
      <section class="card" id="paste"></section>
      <section class="card" id="settings"></section>
      <section class="card" id="participants"></section>
      <section class="card" id="battles"></section>
      <section class="card" id="recycling"></section>
      <section class="card" id="helpers"></section>
    </div>
    <div class="col col-results">
      <section class="card" id="results"></section>
      <section class="card" id="transfers"></section>
    </div>
  </div>
  <footer class="foot"><span data-t="footer"></span> · <a href="https://github.com/Neffez/pr0game-hub" target="_blank" rel="noopener" data-t="source">Source code</a></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="uniDialog" aria-labelledby="uniTitle">
  <form method="dialog" class="dlg">
    <div class="dlg-head">
      <div><h2 id="uniTitle" data-t="uniSettings">Universe settings</h2><p data-t="uniDialogHint">Stored locally in your browser.</p></div>
      <button class="icon-btn" value="close" data-t-aria="close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="dlg-body" id="uniFields"></div>
    <div class="dlg-foot">
      <button type="button" class="btn ghost" id="uniReset" data-t="defaults">Defaults</button>
      <button class="btn primary" value="close" data-t="done">Done</button>
    </div>
  </form>
</dialog>
<script type="module" src="./main.js"></script>
</body>
</html>
