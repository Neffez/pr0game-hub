  /api/{uni}/ingest:
    post:
      tags: [Universe]
      operationId: ingestPage
      security: [{ sessionCookie: [] }]
      description: >-
        Stores a pasted game page. `forUser` may point to another member only for messages and combat reports,
        not for empire, overview or fleets. Player profiles (`page=playerCard`, the in-game popup) store the home
        planet. `dryRun` returns the preview without storing. When nothing was recognized
        (`pageType` `unknown`), `explain` says why: `code` one of `too_short`, `not_game`, `language` (with `lang`),
        `unsupported_page` (with the game's `page` id), `parse_failed` (a page the hub reads, nothing found) or
        `unknown_game_page`.
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestSummary' }
  /api/{uni}/ingest/sample:
    post:
      tags: [Universe]
      operationId: sendParserSample
      security: [{ sessionCookie: [] }]
      description: >-
        Sends a page the hub found nothing in to the hub's admins as a parser sample. Body: `html` and/or `text` (at
        most 4 MB together), `note` (up to 500 characters). Stored anonymized (scripts, styles, form values, session
        tokens in links, e-mail addresses and the sender's own names removed) for the retention of raw syncs; the
        explanation is worked out again on the server. Counts against the paste rate limit.
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  explain: { $ref: '#/components/schemas/Explanation' }
