        attacking player's research from the newest spy report showing it (null when unknown).
        `enemy.planet_ships` holds the ships on the attacked planet changed by hand (null: those of `spy`).
        A fleet in flight carries `seen` (`arrival`, `time` of the overview, `ships` flying), from its member's
        overview or, in an ACS, from another participant's overview showing it from a planet of that member.
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
