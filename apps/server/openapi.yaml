  /api/{uni}/fleets/alerts:
    put:
      tags: [Universe]
      operationId: putFleetAlert
      description: >-
        Notify the caller when one of their own fleets in flight arrives, `lead` minutes before (default 0: at the
        arrival). The fleet is given as listed in the caller's newest fleet list (mission, phase, start, target, arrival;
        the arrival may be a few seconds off). Setting it again changes the lead.
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phase, from, arrival]
              properties:
                mission: { type: [integer, 'null'], description: Game mission id }
                phase: { type: string, enum: [out, return, hold] }
                from: { type: object, description: 'Start: `{ coords: { g, s, p }, type }`' }
                to: { type: [object, 'null'], description: 'Target: `{ coords: { g, s, p }, type }`' }
                arrival: { type: integer, description: Unix seconds }
                lead: { type: integer, minimum: 0, maximum: 120, description: Minutes before the arrival (default 0) }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts: { type: array, items: { $ref: '#/components/schemas/FleetAlert' } }
        '400': { description: 'Invalid body (`alert_invalid`)' }
        '404': { description: 'No such own fleet in flight in the caller''s newest fleet list (`fleet_not_found`)' }
  /api/{uni}/fleets/alerts/{id}:
    delete:
      tags: [Universe]
      operationId: deleteFleetAlert
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts: { type: array, items: { $ref: '#/components/schemas/FleetAlert' } }
        '404': { description: 'Not an alert of the caller (`alert_not_found`)' }
  /api/{uni}/buildings:
    get:
      tags: [Universe]
      operationId: getBuildings
      description: >-
        The caller's planets and moons for the build & research page: per planet the levels, resources (with their time),
        production per hour, storage, fields and build queue of the newest synced empire page or buildings page, the
        cost and build time of the next level as a buildings page showed them (`shown`, valid while `next` is still the
        next level) and the resources of fleets landing on it (`arrivals`); plus research, the catch-up bonus, the
        building speed (derived from a buildings page or the universe setting `buildingSpeed`, null when unknown), the
        storage factor, the caller's building alerts (alerts whose level is built or queued are removed) and the
        buildings the caller hid (`hidden`, kept in the account).
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Buildings' }
  /api/{uni}/buildings/alerts:
    put:
      tags: [Universe]
      operationId: putBuildingAlert
      description: >-
        Notify the caller when `level` of building or research `id` on one of their synced planets is affordable and not
        blocked (one alert per element and planet, replaces its level; research only on planets).
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [g, s, p, type, id, level]
              properties:
                g: { type: integer }
                s: { type: integer }
                p: { type: integer }
                type: { type: string, enum: [planet, moon] }
                id: { type: integer, description: Building or research id }
                level: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts: { type: array, items: { $ref: '#/components/schemas/BuildingAlert' } }
        '400': { description: 'Invalid body or no such building on that planet type (`alert_invalid`, `building_unknown`)' }
        '404': { description: 'Not one of the caller''s synced planets (`planet_not_found`)' }
  /api/{uni}/buildings/hidden:
    put:
      tags: [Universe]
      operationId: putHiddenBuildings
      description: Replaces the buildings and research the caller hides under build & research (kept in the account, for all planets and universes).
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
