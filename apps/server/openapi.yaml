  /api/{uni}/hostile-attacks:
    get:
      tags: [Combat]
      operationId: getHostileAttacks
      description: >-
        Hostile attacks on members (overview pastes) and from phalanx results, ACS fleets as one attack. Listed until
        their latest possible return, also after the impact (taken from the member's older fleet lists then).
        `planId` and `holdPlanId` name the retime and hold plan answering an attack; `hidden` (`by`: member name,
        `at`: epoch seconds) is set when a member hid it for the group, else null.
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { type: object } }
  /api/{uni}/hostile-attacks/hide:
    post:
      tags: [Combat]
      operationId: hideHostileAttack
      description: >-
        Hides a hostile attack in the raid planner for the whole group, until the attack's latest possible return
        (`until`). A later attack with the same key (same route and lead ships) arriving after that is listed again.
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, description: '`key` of the attack from GET /hostile-attacks' }
      responses:
        '200':
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        '404': { description: 'No such hostile attack listed (`attack_not_found`)' }
  /api/{uni}/hostile-attacks/unhide:
    post:
      tags: [Combat]
      operationId: unhideHostileAttack
      description: Shows a hidden hostile attack again for the whole group (no error when it is not hidden).
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
  /api/{uni}/own-attacks:
    get:
      tags: [Combat]
      operationId: getOwnAttacks
      description: >-
        Own attacks in flight (attack, ACS attack, destroy) from the members' newest overview pastes that no open plan
        on the target covers yet (target time within an hour of the arrival). Only listed for their participants: the
        member whose own fleet it is, in an ACS also members whose planet a joined fleet starts from (galaxy data).
        ACS fleets as one attack, the lead first; fleets of non-members have `memberId` null.
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OwnAttack' } }
  /api/{uni}/battle-hall:
    get:
      tags: [Combat]
      operationId: getBattleHall
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
        - name: page
          in: query
          schema: { type: integer }
        - name: sort
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { type: object }
  /api/{uni}/combat-reports/{id}:
    get:
      tags: [Combat]
      operationId: getCombatReport
      description: >-
        Archived battle report: outcome, losses, debris, `loot_metal`, `loot_crystal`, `loot_deuterium` (captured by
        all attackers together, 0 for reports archived before the loot was read), the attacked planet or moon `g`, `s`,
        `p`, `planet_type` (null when the page hid the coordinates) and the fleets before and after. Reports pasted as
        text have the id of the battle message at the same target and time, else the id of the same battle archived
        from its public page (same time and losses, coordinates hidden), else a local id `text-<epoch>-<g>-<s>-<p>`.
        Archiving a report again fills in what the stored one lacked (target, loot).
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema: { type: object }
  /api/{uni}/raids:
    get:
      tags: [Combat]
      operationId: getRaids
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
        - name: from
          in: query
          schema: { type: integer }
        - name: to
          in: query
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema: { type: object }
  /api/{uni}/expeditions:
    get:
      tags: [Combat]
      operationId: getExpeditions
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
        - name: from
          in: query
          schema: { type: integer }
        - name: to
          in: query
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema: { type: object }
