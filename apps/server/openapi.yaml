            application/json:
              schema:
                type: object
                properties:
                  hidden: { type: array, items: { type: integer } }
        '400': { description: 'Not a list of building or research ids (`hidden_invalid`)' }
  /api/{uni}/buildings/alerts/{id}:
    delete:
