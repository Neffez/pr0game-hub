openapi: 3.1.0
info:
  title: pr0game Hub API
  version: 1.0.0
  description: |
    JSON API for alliance data synced into the hub. Read-only personal access tokens (`hubpat_…`) use the same
    endpoints as the web app for GET requests. Create tokens under **Account** in the hub (session cookie required).

    **Group scope:** For universe routes, send `X-Hub-Group` with the alliance group id, or `group` as a query parameter.
    If omitted, the first group you belong to in that universe is used.

    **Privacy:** Fleet movements and in-game messages from other members respect their sharing settings; your own data
    is always complete for you.
servers:
  - url: /hub
    description: Default base path (override with the `BASE_PATH` env variable)
security:
  - bearerAuth: []
tags:
  - name: Meta
  - name: Auth
  - name: Catalog
  - name: Universe
  - name: Intelligence
  - name: Combat
  - name: Social
  - name: Admin
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal read-only token from Account → API tokens
    sessionCookie:
      type: apiKey
      in: cookie
      name: hub_session
      description: Browser session after login (required to create or revoke API tokens)
  parameters:
    Uni:
      name: uni
      in: path
      required: true
      schema: { type: string }
      description: Universe slug (e.g. `u8`)
    HubGroupHeader:
      name: X-Hub-Group
      in: header
      schema: { type: integer }
      description: Alliance group id (see `GET /api/auth/me`)
    HubGroupQuery:
      name: group
      in: query
      schema: { type: integer }
      description: Alliance group id (alternative to `X-Hub-Group`, required for SSE)
    PlanId:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: Attack plan id
  schemas:
    LootState:
      type: object
      description: >-
        Input of an ACS loot settlement (`@pr0hub/loot`, the same as the loot calculator's share links). Resources are
        `{ m, k, d }` (metal, crystal, deuterium), ships element id -> amount. `transfers` null: the suggested deliveries.
      properties:
        participants:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              flightDeut: { type: integer }
              recDeut: { type: integer }
              missiles: { type: integer }
              extra: { type: object }
        helpers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              keepPct: { type: number, minimum: 0, maximum: 20, description: Share of what they recycled the helper keeps (game rule at most 20 %) }
              recDeut: { type: integer, description: Recycler deuterium, refunded only with `settings.helperDeut` }
        battles:
          type: array
          items:
            type: object
            properties:
              time: { type: [integer, 'null'] }
              loot: { type: object }
              fleets:
                type: array
                items:
                  type: object
                  properties:
                    participant: { type: string }
                    start: { type: object }
                    end: { type: object }
                    carried: { type: object }
                    loot: { type: object, description: Loot this fleet brought home (wins over the share by cargo space) }
              debris: { type: object, description: 'Debris field at the target after the battle (`{ m, k }`, battle report), when known' }
        recycling:
          type: array
          items:
            type: object
            properties:
              by: { type: string }
              m: { type: integer }
              k: { type: integer }
              field: { type: object, description: 'Debris field before this collection (`{ m, k }`, recycling report), when known' }
              time: { type: [integer, 'null'], description: Time of the recycling report, when known }
        settings:
          type: object
          properties:
            mode: { type: string, enum: [equal, investment] }
            rates: { type: object, description: Metal and crystal per deuterium }
            refRates: { type: [object, 'null'] }
            deficitMetalShare: { type: number }
            cargoShip: { type: integer }
            helperDeut: { type: boolean, description: Refund the helpers' recycler deuterium on top of their share (default false) }
        transfers: { type: [array, 'null'], items: { type: object } }
    PushSettings:
      type: object
      properties:
        attackSelf: { type: boolean, description: Hostile fleets heading for the caller (default on) }
        attackOthers: { type: boolean, description: Hostile fleets heading for other members (default off) }
        invites: { type: boolean, description: Invitations to raid planner plans (default on) }
        comments: { type: boolean, description: New comments in threads the caller wrote in (default on) }
        launch: { type: boolean, description: Launch reminders of the caller's plan fleets (default on) }
        buildings: { type: boolean, description: The next level of a building the caller waits for is affordable (default on) }
        fleets: { type: boolean, description: An own fleet the caller set an alert for arrives (or is about to, by the alert's lead) (default on) }
        storage: { type: boolean, description: 'A storage (metal, crystal, deuterium) on one of the caller''s planets is full (default on)' }
        leadMinutes: { type: integer, enum: [1, 2, 5, 10, 15, 30], description: Launch reminder this many minutes ahead (default 5) }
    DiscordSettings:
      type: object
      required: [webhook, userId, prefs]
      properties:
        webhook: { type: [string, 'null'], description: 'Start of the caller''s webhook URL (the URL itself is never returned), null when none is set' }
        userId: { type: [string, 'null'], description: Caller's Discord user id, mentioned in their alliance's Discord channel }
        prefs: { $ref: '#/components/schemas/PushSettings' }
    DiscordChannelSettings:
      type: object
      required: [webhook, prefs]
      properties:
        webhook: { type: [string, 'null'], description: 'Start of the channel''s webhook URL (the URL itself is never returned), null when none is set' }
        prefs: { $ref: '#/components/schemas/DiscordChannelPrefs' }
    DiscordChannelPrefs:
      type: object
      properties:
        attacks: { type: boolean, description: Hostile fleets heading for members (default on) }
        plans: { type: boolean, description: New raid planner plans (default on) }
        launch: { type: boolean, description: Launch reminders of the members' plan fleets (default on) }
        leadMinutes: { type: integer, enum: [1, 2, 5, 10, 15, 30], description: Launch reminder this many minutes ahead (default 5) }
        lang: { type: string, enum: [de, en], description: Language of the channel's messages (default de) }
    BuildingAlert:
      type: object
      required: [id, g, s, p, planet_type, element_id, level, created_at]
      properties:
        id: { type: integer }
        g: { type: integer }
        s: { type: integer }
        p: { type: integer }
        planet_type: { type: string, enum: [planet, moon] }
        element_id: { type: integer }
        level: { type: integer }
        created_at: { type: integer }
    FleetAlert:
      type: object
      required: [id, arrival, lead, fleet, created_at]
      properties:
        id: { type: integer }
        arrival: { type: integer, description: Unix seconds, from the caller's newest fleet list }
        lead: { type: integer, description: Minutes before the arrival to notify (0 at the arrival) }
        fleet: { type: object, description: The fleet movement as last seen in the caller's fleet list }
        created_at: { type: integer }
    Buildings:
      type: object
      required: [planets, research, researchQueue, researchSpeed, universityFactor, catchUp, catchUpFrom, buildingSpeed, storageFactor, empireTime, fleetsTime, alerts, hidden]
      properties:
        planets:
          type: array
          items:
            type: object
            required: [key, name, coords, type, source, planet, shown, arrivals]
            properties:
              key: { type: string, description: '`g:s:p:type`' }
              name: { type: string }
              coords: { type: object, properties: { g: { type: integer }, s: { type: integer }, p: { type: integer } } }
              type: { type: string, enum: [planet, moon] }
              source: { type: string, enum: [empire, buildings, research], description: Page the levels and resources come from }
              planet:
                type: object
                description: >-
                  levels (`values`), `resources` at `time` (Unix seconds), `perHour`, `storage` (when shown), `fields`,
                  `queue` (target levels, `end` when known) and `busy`: research (account wide, locks research lab and
                  TechnoDome), the planet's shipyard (locks nanite factory and shipyard) and `lab` (a research lab or
                  TechnoDome in any build queue, locks research) in use, each `{ until }` (Unix seconds, null when
                  unknown) or null when free
              shown: { type: [object, 'null'], description: 'building id -> `{ next, cost, time }` as the buildings page showed them' }
              shownResearch: { type: [object, 'null'], description: 'research id -> `{ next, cost, time }` as the research page of this planet showed them' }
              arrivals:
                type: array
                items:
                  type: object
                  properties:
                    at: { type: integer, description: Unix seconds }
                    resources: { type: object, description: 901-903 }
                    mission: { type: [integer, 'null'] }
                    missionName: { type: string }
                    back: { type: boolean, description: Return flight }
                    from: { type: object }
        research: { type: object, description: 'Research levels of the account (research id -> level), finished queue entries included' }
        researchQueue:
          type: array
          description: Account wide research queue, first in progress (from the newest research page, overview or empire page)
          items:
            type: object
            properties:
              id: { type: integer }
              level: { type: integer }
              end: { type: [integer, 'null'] }
        researchSpeed: { type: [integer, 'null'], description: 'Derived from a research page, else the universe setting `researchSpeed`; null when unknown' }
        universityFactor: { type: number, description: 'Universe setting `universityFactor` (research time −% per TechnoDome level)' }
        catchUp:
          type: [number, 'null']
          description: >-
            Catch-up bonus in percent, not rounded: the exact value behind the costs of a buildings page, the rounded one
            of the overview, or calculated like the game from newer synced statistics; null when the universe has none
        catchUpFrom:
          type: [object, 'null']
          properties:
            source: { type: string, enum: [page, research, overview, stats], description: 'page: a buildings page, research: a research page' }
            time: { type: integer, description: Unix seconds of that page or statistics update }
        buildingSpeed: { type: [integer, 'null'] }
        storageFactor: { type: number }
        empireTime: { type: [integer, 'null'] }
        fleetsTime: { type: [integer, 'null'] }
        alerts: { type: array, items: { $ref: '#/components/schemas/BuildingAlert' } }
        hidden: { type: array, items: { type: integer }, description: Building ids the caller hid on the buildings page }
    PlanBody:
      type: object
      properties:
        g: { type: integer }
        s: { type: integer }
        p: { type: integer }
        type: { type: string, enum: [planet, moon] }
    OwnAttack:
      type: object
      properties:
        key: { type: string, description: 'Stable while the attack lasts: route and the lead fleet''s ships' }
        seen: { type: integer, description: Page time of the newest overview showing it }
        arrival: { type: integer }
        to: { $ref: '#/components/schemas/PlanBody' }
        player: { type: [object, 'null'], description: 'Owner of the target (galaxy data): id, name' }
        fleets:
          type: array
          description: The lead first
          items:
            type: object
            properties:
              memberId: { type: [integer, 'null'], description: 'null for a non-member''s ACS fleet' }
              member: { type: [string, 'null'] }
              player: { type: [object, 'null'], description: 'Owner of the start (galaxy data): id, name' }
              from: { $ref: '#/components/schemas/PlanBody' }
              mission: { type: [integer, 'null'] }
              ships: { type: object, additionalProperties: { type: integer } }
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: English message }
        code: { type: string, description: Stable key for clients }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        isAdmin: { type: boolean }
        lang: { type: string, enum: [de, en] }
        dateFormat:
          type: string
          enum: [auto, dmy., dmy/, ymd]
          description: Date format of the hub; `auto` follows `lang` (de DD.MM.YYYY, en DD/MM/YYYY)
    GroupMembership:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string, enum: [member, admin] }
        universe: { type: string }
        universe_name: { type: string }
    Me:
      type: object
      properties:
        user: { oneOf: [{ $ref: '#/components/schemas/User' }, { type: 'null' }] }
        groups:
          type: array
          items: { $ref: '#/components/schemas/GroupMembership' }
    ApiTokenMeta:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        prefix: { type: string }
        createdAt: { type: integer, description: Unix seconds }
        lastUsedAt: { type: integer, nullable: true }
    ApiTokenCreated:
      allOf:
        - { $ref: '#/components/schemas/ApiTokenMeta' }
        - type: object
          required: [token]
          properties:
            token: { type: string, description: Shown once; store securely }
    Catalog:
      type: object
      properties:
        names:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: string }
          description: Language → element id → name
        costs:
          type: object
          additionalProperties:
            type: array
            items: { type: number }
            minItems: 4
            maxItems: 4
          description: Element id → [metal, crystal, deuterium, factor]
        classes:
          type: object
          properties:
            buildings: { type: integer }
            research: { type: integer }
            fleet: { type: integer }
            defense: { type: integer }
            resources: { type: integer }
    Context:
      type: object
      description: Universe and alliance context for the selected group
      properties:
        universe: { type: object }
        group:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            role: { type: string }
        members: { type: array, items: { type: object } }
        me: { $ref: '#/components/schemas/User' }
        own: { type: object, nullable: true }
    Overview:
      type: object
      properties:
        players: { type: array, items: { type: object } }
        planets: { type: array, items: { type: object } }
        coverage: { type: array, items: { type: object } }
        slots: { type: object }
    Imperium:
      type: object
      properties:
        userId: { type: integer }
        empire: { type: object, nullable: true }
        spy:
          type: object
          nullable: true
          description: Without an empire page, the empire put together from the spy reports of the member's player (planets with buildings, fleet and defense per newest report; research with `researchTime`).
        overview: { type: object, nullable: true }
        fleets: { type: array, items: { type: object }, nullable: true }
        fleetHistory: { type: array, items: { type: object } }
        fleetAlerts:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/FleetAlert' }
          description: >-
            The caller's fleet alerts, only when the member is the caller (null otherwise). Alerts whose fleet is missing
            from a newer fleet list before its arrival (recalled) and alerts arrived more than 10 minutes ago are removed.
        player: { type: object, nullable: true }
        fleetBase: { type: object, nullable: true }
        leader: { type: object, nullable: true }
    AllianceMember:
      type: object
      properties:
        key: { type: string }
        user_id: { type: integer, nullable: true }
        username: { type: string }
        ingame_name: { type: string, nullable: true }
        player_id: { type: integer, nullable: true }
        source: { type: string, enum: [empire, spy], nullable: true }
        created_at: { type: integer, nullable: true }
        data: { type: object, nullable: true }
        fleets: { type: array, items: { type: object }, nullable: true }
        fleetHistory: { type: array, items: { type: object } }
paths:
  /api/health:
    get:
      tags: [Meta]
      operationId: health
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
  /api/openapi.json:
    get:
      tags: [Meta]
      operationId: openApiJson
      security: []
      responses:
        '200':
          description: This specification as JSON
  /api/openapi.yaml:
    get:
      tags: [Meta]
      operationId: openApiYaml
      security: []
      responses:
        '200':
          description: This specification as YAML
          content:
            text/yaml:
              schema: { type: string }
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      responses:
        '200':
          description: Current user and group memberships
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
  /api/auth/date-format:
    post:
      tags: [Auth]
      operationId: setDateFormat
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dateFormat]
              properties:
                dateFormat: { type: string, enum: [auto, dmy., dmy/, ymd] }
      responses:
        '200':
          description: Stored on the account
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  dateFormat: { type: string }
        '400':
          description: Unknown date format (`date_format_invalid`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/auth/push-settings:
    get:
      tags: [Auth]
      operationId: getPushSettings
      description: Which notifications are pushed to the caller's devices (the bell lists all of them).
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushSettings' }
    post:
      tags: [Auth]
      operationId: setPushSettings
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: '#/components/schemas/PushSettings' }]
              description: Fields to change; missing ones stay as they are
      responses:
        '200':
          description: Stored settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushSettings' }
        '400':
          description: Lead time not one of the allowed values (`push_settings_invalid`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/push/key:
    get:
      tags: [Auth]
      operationId: getPushKey
      description: Whether web push is set up on this hub (`PUSH_CONTACT`), and the VAPID public key browsers subscribe with.
      responses:
        '200':
          description: VAPID key and status
          content:
            application/json:
              schema:
                type: object
                required: [enabled, publicKey]
                properties:
                  enabled: { type: boolean }
                  publicKey: { type: [string, 'null'], description: Base64url (uncompressed P-256 point) }
  /api/push/subscriptions:
    post:
      tags: [Auth]
      operationId: addPushSubscription
      description: |
        Registers a browser for push notifications of the caller (the browser's `PushSubscription.toJSON()`). An
        endpoint registered by another user before moves to the caller; at most 10 browsers per user (the oldest goes).
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri, description: HTTPS URL of the browser's push service }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '400':
          description: Invalid endpoint or keys (`push_endpoint_invalid`, `push_keys_invalid`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Push is not set up on this hub (`push_disabled`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Auth]
      operationId: removePushSubscription
      description: Unregisters a browser of the caller (switched off, or before logging out).
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri }
      responses:
        '200':
          description: Unregistered (or not registered)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  removed: { type: integer, description: 0 when the browser was not registered for the caller }
  /api/push/test:
    post:
      tags: [Auth]
      operationId: sendTestPush
      description: Sends a test notification to all browsers of the caller.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices: { type: integer, description: Browsers the push services accepted it for }
        '409':
          description: Push is not set up on this hub (`push_disabled`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/auth/discord:
    get:
      tags: [Auth]
      operationId: getDiscordSettings
      description: |
        The caller's own Discord webhook (only its start), their Discord user id and which notifications are posted to
        the webhook (the same kinds as push, set separately).
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscordSettings' }
    post:
      tags: [Auth]
      operationId: setDiscordSettings
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Fields to change; missing ones stay as they are
              properties:
                webhook: { type: [string, 'null'], description: 'Discord webhook URL (`https://discord.com/api/webhooks/…`); null or empty removes it' }
                userId: { type: [string, 'null'], description: Discord user id (17 to 20 digits); null or empty removes it }
                prefs: { $ref: '#/components/schemas/PushSettings' }
      responses:
        '200':
          description: Stored settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscordSettings' }
        '400':
          description: Invalid webhook, user id or settings (`discord_webhook_invalid`, `discord_user_id_invalid`, `discord_settings_invalid`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/auth/discord/test:
    post:
      tags: [Auth]
      operationId: sendTestDiscord
      description: Posts a test message to the caller's own Discord webhook.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Discord took the message
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        '409':
          description: No webhook set (`discord_not_configured`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Discord refused the message (`discord_send_failed`); a webhook Discord no longer knows is removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/admin/groups/{id}/discord:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer }, description: Alliance group id }
    get:
      tags: [Admin]
      operationId: getGroupDiscord
      description: The alliance's Discord channel webhook (only its start) and what is posted there; alliance admins.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscordChannelSettings' }
        '403':
          description: Not an admin of the alliance (`group_admin_only`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Admin]
      operationId: setGroupDiscord
      description: Sets the channel webhook and what is posted there; alliance admins.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Fields to change; missing ones stay as they are
              properties:
                webhook: { type: [string, 'null'], description: Discord webhook URL; null or empty removes it }
                prefs: { $ref: '#/components/schemas/DiscordChannelPrefs' }
      responses:
        '200':
          description: Stored settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscordChannelSettings' }
        '400':
          description: Invalid webhook or settings (`discord_webhook_invalid`, `discord_settings_invalid`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
