    get:
      tags: [Combat]
      operationId: getDeck
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
        - name: user
          in: query
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema: { type: object }
  /api/{uni}/plans:
    get:
      tags: [Combat]
      operationId: getPlans
      description: >-
        Raid planner plans including fleets, enemy retime data and phalanx snapshots. `spy` holds the values for the
        combat simulators: the target's newest spy report, for hold plans the defended planet (attacked member's empire
        page, else its newest spy report). Hold plans also return `enemy.research` and `enemy.research_time`, the
        attacking player's research from the newest spy report showing it (null when unknown).
        `enemy.planet_ships` holds the ships on the attacked planet changed by hand (null: those of `spy`).
        A fleet in flight carries `seen` (`arrival`, `time` of the overview, `ships` flying), from its member's
        overview or, in an ACS, from another participant's overview showing it from a planet of that member.
        `guests` lists ACS fleets of non-members taken over from an overview (`planOwnAttack`) for the simulators, with
        their player's research from the newest spy report showing it (`research`, `research_time`, null when unknown).
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { type: object } }
  /api/{uni}/plans/own:
    post:
      tags: [Combat]
      operationId: planOwnAttack
      description: >-
        Plan for an own attack in flight (`key` from `getOwnAttacks`), by one of its participants: target and exact
        target time from the overview, status launched, one launched fleet per member with the ships flying (speed
        100 %), fleets of non-members as `guests` of the plan. Claims the target like a new plan.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [key], properties: { key: { type: string } } }
      responses:
        '200':
          description: Plan created; `claimedBy` names the member holding the target claim instead, if any
          content:
            application/json:
              schema: { type: object, properties: { id: { type: integer }, claimedBy: { type: [string, 'null'] } } }
        '404':
          description: Attack arrived, already planned, not pasted or not the caller's (`attack_not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/{uni}/settlements:
    get:
      tags: [Combat]
      operationId: listSettlements
      description: >-
        Attack and hold plans to settle: plans of the last `days` (default 30, at most 90) that were launched or done,
        or have a saved settlement, newest first. `members` are the plan's members (for a hold also the attacked
        member), `battle` whether a battle message or report at the target around the plan's time is known, `saved`
        the saved settlement's state (null if none) with the number of deliveries and how many are marked done.
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    mission: { type: string, enum: [attack, hold] }
                    g: { type: integer }
                    s: { type: integer }
                    p: { type: integer }
                    planet_type: { type: string, enum: [planet, moon] }
                    target_time: { type: integer }
                    status: { type: string }
                    creator: { type: string }
                    player_id: { type: [integer, 'null'] }
                    player_name: { type: [string, 'null'] }
                    members: { type: array, items: { type: string } }
                    battle: { type: boolean }
                    saved:
                      oneOf:
                        - { type: 'null' }
                        - type: object
                          properties:
                            updated_at: { type: integer }
                            updated_by: { type: [string, 'null'] }
                            deliveries: { type: integer }
                            done: { type: integer }
  /api/{uni}/settlements/from-report:
    post:
      tags: [Combat]
      operationId: settlementFromReport
      description: >-
        Plan to settle a battle after the fact, from a pasted battle report (copied while logged in, with
        coordinates). The report is archived like a sync. When members attacked it is an attack, when members defended
        a hold; `mission` decides when set. A plan at the same target around the report's time with that mission is
        returned instead of a new one (`existing`). A new plan is done: members' fleets launched from their start
        planets with the ships before the battle (speed 100 %), non-members as guests; a hold keeps the first defender
        as the attacked member and the attackers as the enemy. Open its settlement with GET /plans/{id}/settlement.
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, description: Text of the battle report }
                mission: { type: string, enum: [attack, hold], description: 'Omit to detect it from the members in the report' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  existing: { type: boolean }
                  mission: { type: string, enum: [attack, hold] }
        '400':
          description: >-
            No battle report (`report_invalid`), no coordinates in it (`report_no_target`) or no member on the chosen
            side (`report_no_member`)
  /api/{uni}/plans/{id}/settlement:
    parameters:
      - { $ref: '#/components/parameters/Uni' }
      - { $ref: '#/components/parameters/HubGroupHeader' }
      - { $ref: '#/components/parameters/HubGroupQuery' }
      - { $ref: '#/components/parameters/PlanId' }
    get:
      tags: [Combat]
      operationId: getSettlement
      description: >-
        ACS loot settlement of an attack or hold plan. `saved` is the settlement saved for the group (null if none), `draft` one
        prefilled from the hub's data: participants from the plan's fleets (members as `u<user id>`, then guest fleets),
        battles at the target around the plan's time (fleets and losses from the archived battle report, else the
        planned ships), loot by cargo space unless a member's fleet return messages (one per fleet in the report, the
        first after the battle) or else their flights home in the overview (first per fleet with its surviving ships)
        tell what each fleet brought home (`sources.returnLoot`, `sources.returnSource`; together at most the battle's
        loot), recycling
        reports at the target within 24 hours (members outside the plan as helpers keeping 20 %) and the deuterium of
        the attack flights. `sources` tells where the draft's values come from. Both carry `result`, computed by
        `@pr0hub/loot`. `me` is the caller's id in a settlement. A hold is settled like an ACS: participants are the hold
        fleets and the attacked member, the battle report's defenders (ships only) and no loot, so the debris covers their
        losses.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    type: object
                    description: The plan's target and time
                    properties:
                      id: { type: integer }
                      mission: { type: string, enum: [attack, hold] }
                      g: { type: [integer, 'null'] }
                      s: { type: [integer, 'null'] }
                      p: { type: [integer, 'null'] }
                      planet_type: { type: string, enum: [planet, moon] }
                      target_time: { type: integer }
                      status: { type: string }
                  can_edit: { type: boolean, description: The caller may save the settlement (participant, creator or admin) }
                  saved:
                    oneOf:
                      - { type: 'null' }
                      - type: object
                        properties:
                          state: { $ref: '#/components/schemas/LootState' }
                          done: { type: array, items: { type: string }, description: 'Deliveries marked done ("<from id>><to id>")' }
                          updated_at: { type: integer }
                          updated_by: { type: [string, 'null'] }
                          result: { type: object }
                  draft:
                    type: object
                    properties:
                      state: { $ref: '#/components/schemas/LootState' }
                      sources: { type: object }
                      result: { type: object }
                  me: { type: string }
        '404':
          description: No attack plan with this id in the group (`plan_not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Combat]
      operationId: saveSettlement
      description: >-
        Saves the settlement for the group (participants of the plan, for a hold also the attacked member, its creator or
        a group admin). The state is
        cleaned like a share link (known fields only, numbers clamped, at most 5 participants); deliveries marked done
        stay.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [state], properties: { state: { $ref: '#/components/schemas/LootState' } } }
      responses:
        '200':
          description: The saved settlement with `done`, `updated_at`, `updated_by` and `result`
          content:
            application/json:
              schema: { type: object }
        '400':
          description: No or too large state (`settlement_invalid`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not a participant, the creator or an admin (`settlement_not_yours`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Combat]
      operationId: deleteSettlement
      description: Deletes the saved settlement (participants of the plan, its creator or a group admin).
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        '403':
          description: Not a participant, the creator or an admin (`settlement_not_yours`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/{uni}/plans/{id}/settlement/done:
    put:
      tags: [Combat]
      operationId: markSettlementDelivery
      description: >-
        Marks a delivery of the saved settlement as done (`done` true or missing) or open again (`done: false`): its
        sender or receiver, participants of the plan, its creator or a group admin.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
        - { $ref: '#/components/parameters/PlanId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, description: '"<from id>><to id>", e.g. "u3>u7"' }
                done: { type: boolean }
      responses:
        '200':
          content:
            application/json:
              schema: { type: object, properties: { done: { type: array, items: { type: string } } } }
        '404':
          description: No saved settlement (`settlement_not_found`) or plan (`plan_not_found`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/{uni}/claims:
    get:
      tags: [Social]
      operationId: getClaims
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { type: object } }
  /api/{uni}/comments:
    get:
      tags: [Social]
      operationId: getComments
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
        - name: player
          in: query
          schema: { type: integer }
        - name: c
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { type: object } }
  /api/{uni}/comments/counts:
    get:
      tags: [Social]
      operationId: getCommentCounts
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      responses:
        '200':
          content:
            application/json:
              schema: { type: object }
  /api/{uni}/messages:
    get:
      tags: [Social]
      operationId: getMessages
      description: Synced in-game messages (respects per-user and per-message sharing).
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200':
          content:
            application/json:
              schema: { type: object }
  /api/{uni}/notifications:
    get:
      tags: [Social]
      operationId: getNotifications
      description: |
        Current notifications, earliest first: `attack` (hostile fleets heading for a member, from the members' shared
        fleet lists; `fleet`, `fleets`), `invite` (the caller's open invitations to a raid planner plan in planning;
        `plan`, `member` is who invited, `time` its target time, valid until the end of its day or hour by
        `plan.time_precision`), `comment` (comments of others of the last 48 hours in a thread the caller wrote in, after
        the caller's last comment there, one entry per thread; `thread`, `excerpt`, `count`, `member`/`userId` the newest
        author, `time` the newest comment), `launch` (a fleet of the caller in a plan with an exact target time,
        invited or ready, that launches within the next hour; `plan`, `from`, `time` the launch) and `building` (the
        resources for the level of a building or research alert are there, listed 24 hours; `alert`, `planet`, `element`, `level`,
        `time` since when) and `fleet` (an own fleet with a fleet alert, due `lead` minutes before its arrival, listed
        from an hour before that until 10 minutes after the arrival; `alert`, `fleet`, `lead`, `time` the arrival). Push notifications send
        the same entries (see `/api/push/subscriptions`).
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, kind, userId, member, time]
                  properties:
                    id: { type: string, description: Stable while the event lasts }
                    kind: { type: string, enum: [attack, invite, comment, launch, building, fleet, storage] }
                    userId: { type: integer, description: 'attack: the attacked member; invite: who invited; comment: the newest author; launch, building, fleet and storage: the caller' }
                    member: { type: string }
                    time: { type: integer, description: Unix seconds (arrival, plan target time, newest comment, launch, since when a building level is affordable, arrival of an alerted fleet, or since when a storage is full) }
                    alert: { type: integer, description: 'building and fleet: id of the building or fleet alert' }
                    lead: { type: integer, description: 'fleet only: minutes before the arrival the alert reminds' }
                    planet:
                      type: object
                      description: 'building: the planet or moon; storage: the planet (no type, moons have no production)'
                      properties:
                        g: { type: integer }
                        s: { type: integer }
                        p: { type: integer }
                        type: { type: string, enum: [planet, moon] }
                        name: { type: string }
                    element: { type: integer, description: 'building only: building id' }
                    level: { type: integer, description: 'building only: the affordable level' }
                    resource: { type: integer, enum: [901, 902, 903], description: 'storage only: the full storage''s resource (metal, crystal, deuterium)' }
                    fleet: { type: object, description: 'attack: the fleet (for an ACS the lead fleet with all ships); fleet: the own fleet of the alert' }
                    fleets: { type: integer, description: 'attack only: number of fleets of an ACS' }
                    plan:
                      type: object
                      description: 'invite and launch (launch: `time_precision` is always exact and missing; `target_time` instead)'
                      properties:
                        id: { type: integer }
                        g: { type: [integer, 'null'] }
                        s: { type: [integer, 'null'] }
                        p: { type: [integer, 'null'] }
                        planet_type: { type: string, enum: [planet, moon] }
                        mission: { type: string, enum: [attack, hold] }
                        time_precision: { type: string, enum: [day, hour, exact] }
                        target_time: { type: integer }
                    thread:
                      description: 'comment only: a player, or a planet/moon with its owner'
                      oneOf:
                        - type: object
                          required: [player, name]
                          properties:
                            player: { type: integer }
                            name: { type: string }
                        - type: object
                          required: [g, s, p, type]
                          properties:
                            g: { type: integer }
                            s: { type: integer }
                            p: { type: integer }
                            type: { type: string, enum: [planet, moon] }
                            owner: { type: [string, 'null'] }
                    excerpt: { type: string, description: 'comment only: the newest comment, shortened' }
                    count: { type: integer, description: 'comment only: new comments in the thread' }
                    from:
                      type: object
                      description: 'launch only: start planet or moon of the fleet'
                      properties:
                        g: { type: integer }
                        s: { type: integer }
                        p: { type: integer }
                        type: { type: string, enum: [planet, moon] }
  /api/{uni}/presence:
    get:
      tags: [Social]
      operationId: getPresence
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { type: object } }
  /api/{uni}/events:
    get:
      tags: [Social]
      operationId: subscribeEvents
      description: Server-Sent Events stream (use `group` query; EventSource cannot send headers).
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
