  /api/{uni}/notifications:
    get:
      tags: [Social]
      operationId: getNotifications
      description: |
        Current notifications, earliest first: `attack` (hostile fleets heading for a member, from the members' shared
        fleet lists; `fleet`, `fleets`), `invite` (the caller's open invitations to a raid planner plan in planning;
        `plan`, `member` is who invited, `time` its target time, valid until the end of its day or hour by
        `plan.time_precision`), `comment` (comments of others of the last 48 hours in a thread the caller wrote in, after
        the caller's last comment there, one entry per thread; `thread`, `excerpt`, `count`, `member`/`userId` the newest
        author, `time` the newest comment) and `launch` (a fleet of the caller in a plan with an exact target time,
        invited or ready, that launches within the next hour; `plan`, `from`, `time` the launch). Push notifications send
        the same entries (see `/api/push/subscriptions`).
      parameters:
        - { $ref: '#/components/parameters/Uni' }
        - { $ref: '#/components/parameters/HubGroupHeader' }
        - { $ref: '#/components/parameters/HubGroupQuery' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, kind, userId, member, time]
                  properties:
                    id: { type: string, description: Stable while the event lasts }
                    kind: { type: string, enum: [attack, invite, comment, launch] }
                    userId: { type: integer, description: 'attack: the attacked member; invite: who invited; comment: the newest author; launch: the caller' }
                    member: { type: string }
                    time: { type: integer, description: Unix seconds (arrival, plan target time, newest comment or launch) }
                    fleet: { type: object, description: 'attack only: the fleet (for an ACS the lead fleet with all ships)' }
                    fleets: { type: integer, description: 'attack only: number of fleets of an ACS' }
                    plan:
                      type: object
                      description: 'invite and launch (launch: `time_precision` is always exact and missing; `target_time` instead)'
                      properties:
                        id: { type: integer }
                        g: { type: [integer, 'null'] }
                        s: { type: [integer, 'null'] }
                        p: { type: [integer, 'null'] }
                        planet_type: { type: string, enum: [planet, moon] }
                        mission: { type: string, enum: [attack, hold] }
                        time_precision: { type: string, enum: [day, hour, exact] }
                        target_time: { type: integer }
                    thread:
                      description: 'comment only: a player, or a planet/moon with its owner'
                      oneOf:
                        - type: object
                          required: [player, name]
                          properties:
                            player: { type: integer }
                            name: { type: string }
                        - type: object
                          required: [g, s, p, type]
                          properties:
                            g: { type: integer }
                            s: { type: integer }
                            p: { type: integer }
                            type: { type: string, enum: [planet, moon] }
                            owner: { type: [string, 'null'] }
                    excerpt: { type: string, description: 'comment only: the newest comment, shortened' }
                    count: { type: integer, description: 'comment only: new comments in the thread' }
                    from:
                      type: object
                      description: 'launch only: start planet or moon of the fleet'
                      properties:
                        g: { type: integer }
                        s: { type: integer }
                        p: { type: integer }
                        type: { type: string, enum: [planet, moon] }
