name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # web and server import the built packages
      - run: pnpm --filter "./packages/*" build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The image must build and start: native modules (better-sqlite3) need a prebuilt binary for the image's Node,
  # the slim image has no compiler. The tests above run outside Docker and would not notice.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target tools -t pr0hub-tools .
      - run: docker build -t pr0hub .
      - name: Smoke test
        run: |
          docker run -d --name hub -p 3000:3000 -e SECURE_COOKIES=false -e CRAWLER_ENABLED=false \
            -e ADMIN_BOOTSTRAP_USER=smoke -e ADMIN_BOOTSTRAP_PASSWORD=smokepass1 pr0hub
          for i in $(seq 1 30); do curl -sf http://localhost:3000/hub/api/health && break; sleep 1; done
          curl -sf http://localhost:3000/hub/api/health
          # login writes a session: the database works
          curl -sf -H 'content-type: application/json' -d '{"username":"smoke","password":"smokepass1"}' \
            http://localhost:3000/hub/api/auth/login
          curl -sf -o /dev/null http://localhost:3000/hub/
      - if: failure()
        run: docker logs hub

  # Deployment lives in a private repository: after green tests and image build on main it gets a
  # repository_dispatch (target repo and token are secrets, so forks skip this).
  notify:
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          REPO: ${{ secrets.DISPATCH_REPO }}
        run: |
          if [ -z "$REPO" ] || [ -z "$GH_TOKEN" ]; then echo "No deployment target configured."; exit 0; fi
          gh api "repos/$REPO/dispatches" -f event_type=pr0game-hub -f "client_payload[sha]=$GITHUB_SHA"
